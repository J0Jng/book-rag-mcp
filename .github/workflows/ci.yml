name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (dev extra with pytest and ruff)
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests

      # 默认 addopts 已排除 integration 层：CI 不下载 embedding 模型，
      # 只跑快速层（embedding 全部 mock）。效果层在本地 `pytest -m integration` 跑。
      - name: Test (fast layer)
        run: uv run pytest -q
